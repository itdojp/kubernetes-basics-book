name: Temporary Issue 40 live validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  historical-ingress-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install pinned kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          printf '%s  %s\n' \
            eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa \
            kind-linux-amd64 | sha256sum --check -
          sudo install -o root -g root -m 0755 kind-linux-amd64 /usr/local/bin/kind

      - name: Create pinned lab cluster
        shell: bash
        run: |
          set -euo pipefail
          cat > kind.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: kbb
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 8080
                  protocol: TCP
                - containerPort: 443
                  hostPort: 8443
                  protocol: TCP
          YAML
          kind create cluster \
            --config kind.yaml \
            --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f \
            --wait 5m

      - name: Apply immutable historical manifest
        shell: bash
        run: |
          set -euo pipefail
          commit=451747c70c6fca688e157a8329a3dd219a234fd9
          expected=e4198bf3fcbfecb510516fa6fab3db9cd1132d524896d866101ab6faca1fbc31
          manifest=ingress-nginx-kind-v1.14.3.yaml
          curl -fsSLo "$manifest" \
            "https://raw.githubusercontent.com/kubernetes/ingress-nginx/${commit}/deploy/static/provider/kind/deploy.yaml"
          printf '%s  %s\n' "$expected" "$manifest" | sha256sum --check -
          kubectl apply -f "$manifest"
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=5m

      - name: Verify chapter host-routing lab
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace demo
          kubectl -n demo apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: web
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: web
              spec:
                containers:
                  - name: web
                    image: nginx:stable
                    ports:
                      - name: http
                        containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: web
          spec:
            selector:
              app.kubernetes.io/name: web
            ports:
              - name: http
                port: 80
                targetPort: http
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: web
          spec:
            ingressClassName: nginx
            rules:
              - host: web.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: web
                          port:
                            number: 80
          YAML
          kubectl -n demo rollout status deployment/web --timeout=3m

          response=""
          for _ in $(seq 1 60); do
            response="$(curl -fsS -H 'Host: web.local' http://localhost:8080/ 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q 'Welcome to nginx'; then
              break
            fi
            sleep 2
          done
          printf '%s' "$response" | grep -q 'Welcome to nginx'
          kubectl -n ingress-nginx get deployment,pod
          kubectl -n demo get deployment,service,ingress,pod

      - name: Cleanup cluster
        if: always()
        shell: bash
        run: kind delete cluster --name kbb
